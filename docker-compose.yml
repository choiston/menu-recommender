# =============================================================================
# docker-compose.yml - 컨테이너를 한 번에 띄우는 설정 파일   (test 3.0: db 추가, test 3.3: 인터넷 공개, test 3.4: 보안 강화)
#
#   [인터넷] --> NAS 역방향 프록시(HTTPS) 또는 cloudflared(터널) --> frontend(nginx:80) --+-- 화면 파일
#   [내 Mac] --5500---------------------^                 +-- /api --> backend --> ollama (LLM)
#                                                                            --> db (PostgreSQL)
#
# [test 3.3] 바깥에서 들어올 수 있는 입구는 frontend(nginx) 하나뿐입니다.
#   - backend / ollama / db 는 바깥 포트를 열지 않음 (compose 안에서만 서로 접속)
#   - 5500, 8001 은 127.0.0.1(이 Mac 자신)에만 열어서 같은 와이파이의 다른 기기도 못 들어옴
#   - 비밀번호·토큰은 .env 파일에서 읽음 (.env.example 을 복사해서 만들기, git 에는 올리지 않음)
#
# 컨테이너란? 프로그램 + 실행에 필요한 환경(파이썬 등)을 통째로 담은 작은 가상 컴퓨터.
# 내 PC에 파이썬이나 Ollama를 직접 설치하지 않아도 어디서나 똑같이 실행됩니다.
#
# 자주 쓰는 명령 (이 파일이 있는 폴더에서 실행):
#   docker compose up -d --build   # 이미지 빌드 + 백그라운드(-d)로 실행
#   docker compose --profile tunnel up -d --build   # [test 3.3] 인터넷 공개(Cloudflare Tunnel 포함)
#   docker compose down            # 전부 종료
#   docker compose logs -f backend # 백엔드 로그 실시간 보기
#
# YAML 문법: 들여쓰기(스페이스)로 계층을 표현합니다. 탭(Tab) 문자는 쓰면 안 됩니다!
#            "- 값" 은 리스트(목록)의 한 항목입니다.
# =============================================================================

services:  # 실행할 컨테이너(서비스) 목록

  # ---- 1) Ollama : LLM(llama3.1)을 실제로 돌리는 서버 ----
  ollama:
    image: ollama/ollama        # Docker Hub 에 올라와 있는 공식 이미지를 받아서 그대로 사용
    container_name: menu-ollama # 컨테이너 이름 (docker exec -it menu-ollama ... 할 때 쓰는 이름)
    restart: unless-stopped     # [test 3.3] 꺼지거나 Mac이 재부팅돼도 자동으로 다시 켜짐 (직접 down 한 경우만 제외)
    # [test 3.3] profiles: [ai] → .env 의 COMPOSE_PROFILES 에 ai 가 있을 때만 켜짐.
    #   메모리가 작은 서버(M2: Docker 2GB)에서는 빼서 끔 → 백엔드는 AI 대신 정해진 틀 문장으로 동작
    profiles: [ai]
    # [test 3.3] ports 삭제 → 바깥에서 LLM을 마음대로 쓰지 못하게 함 (backend 만 ollama:11434 로 접속)
    volumes:
      # 볼륨: 컨테이너를 지워도 데이터가 남는 저장 공간.
      # 다운로드한 모델(수 GB)이 /root/.ollama 에 저장되므로, 볼륨이 없으면 재시작할 때마다 다시 받아야 함
      - ollama_data:/root/.ollama

  # ---- 2) Backend : 우리가 만든 FastAPI 서버 (backend/main.py) ----
  backend:
    build: ./backend            # 이미지를 받지 않고 ./backend/Dockerfile 로 직접 만듦(빌드)
    container_name: menu-backend
    restart: unless-stopped
    environment:                # 컨테이너 안에 넣어 줄 환경변수 → main.py 의 os.getenv() 가 읽음
      # 같은 compose 안의 컨테이너끼리는 "서비스 이름"으로 서로를 찾을 수 있습니다.
      # 그래서 localhost 가 아니라 ollama 라고 씀 (컨테이너 안에서 localhost 는 "자기 자신"을 뜻함)
      # [test 3.3] Mac에 Ollama를 직접 설치해 GPU로 빠르게 돌릴 때는 .env 에
      #            OLLAMA_HOST=http://host.docker.internal:11434 로 적으면 됨
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_MODEL=llama3.1   # 사용할 모델. 바꾸려면 여기 수정 후 그 모델을 pull 해야 함
      # [test 3.0] DB 접속 주소: postgresql://사용자:비밀번호@서비스이름:포트/DB이름
      # [test 3.3] 비밀번호는 .env 의 POSTGRES_PASSWORD 에서 읽음
      - DATABASE_URL=postgresql://menu:${POSTGRES_PASSWORD:?.env 파일에 POSTGRES_PASSWORD 를 적어 주세요}@db:5432/menu
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    ports:
      # 내 PC의 8000번은 다른 프로젝트(investment_backend)가 이미 쓰고 있어서 8001번으로 연결.
      # 컨테이너 안에서는 여전히 8000번으로 실행됨 (Dockerfile 의 CMD 참고)
      # [test 3.3] 127.0.0.1 을 앞에 붙여 이 Mac 에서만 접속 가능 (http://localhost:8001/docs 확인용)
      # BACKEND_PORT 로 바꿀 수 있음 (M2 서버는 8001 을 다른 앱이 써서 .env 에서 변경)
      - "127.0.0.1:${BACKEND_PORT:-8001}:8000"
    mem_limit: ${BACKEND_MEM:-512m}   # [test 3.3] 메모리 상한 (같은 서버의 다른 앱 보호)
    depends_on:
      # [test 3.3] ollama 는 선택(profiles: [ai])이라 여기서 뺌. 꺼져 있어도 백엔드는 틀 문장으로 동작
      - db                      # [test 3.0] DB 도 먼저 시작. 준비될 때까지는 db.py 의 wait_for_db() 가 기다려 줌

  # ---- 4) [test 3.0] DB : PostgreSQL 데이터베이스 (메뉴 지식 + 사용자 + 선택 기록 = 우리 자산) ----
  db:
    image: postgres:16-alpine   # 공식 PostgreSQL 16 이미지 (alpine = 가벼운 리눅스)
    container_name: menu-db
    restart: unless-stopped
    mem_limit: ${DB_MEM:-256m}
    environment:
      # 처음 켜질 때 이 값으로 사용자와 DB를 만들어 줌
      # [test 3.3] 비밀번호는 여기 적지 않고 .env 파일에서 읽음 (git 에 올라가지 않게)
      # ⚠️ POSTGRES_PASSWORD 는 DB를 "처음" 만들 때만 적용됨. 이미 만든 DB의 비밀번호를 바꾸려면 README 참고
      - POSTGRES_USER=menu
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?.env 파일에 POSTGRES_PASSWORD 를 적어 주세요}
      - POSTGRES_DB=menu
    volumes:
      # DB 데이터가 저장되는 곳. 볼륨이 있어야 컨테이너를 지워도 데이터(자산)가 남음
      - menu_db_data:/var/lib/postgresql/data
    # ports 를 적지 않음 → 내 PC에서는 직접 접속 불가, 같은 compose 안의 backend 만 접속 가능 (더 안전)
    # (PC의 5432번은 다른 프로젝트 DB들이 쓰고 있어서 충돌도 피함)

  # ---- 3) Frontend : HTML/CSS/JS 파일을 브라우저에 전달하는 간단한 웹 서버 ----
  frontend:
    build: ./frontend           # ./frontend/Dockerfile 로 빌드
    container_name: menu-frontend
    restart: unless-stopped
    mem_limit: 64m
    ports:
      # [test 3.3] 컨테이너 안은 nginx 80번. 이 Mac 에서만 http://localhost:5500 으로 확인 가능
      #            (인터넷 사용자는 아래 cloudflared 터널을 통해 들어옴)
      # FRONTEND_BIND / FRONTEND_PORT 로 바꿀 수 있음.
      #   M2 서버처럼 시놀로지 NAS 역방향 프록시가 이 포트로 넘겨줄 때는 FRONTEND_BIND=0.0.0.0 (같은 네트워크의 NAS가 접속해야 함)
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-5500}:80"
      # [test 3.4] 이 Mac 에서만 확인하는 입구 (nginx 81번, 비밀 머리글 검사 없음). 바깥에는 절대 안 열림
      - "127.0.0.1:${LOCAL_PORT:-5501}:81"
    environment:
      # [test 3.4] NAS 역방향 프록시가 붙여 주는 비밀 머리글(X-Menu-Proxy) 값. 비어 있으면 검사 안 함(개발 PC)
      - PROXY_SECRET=${PROXY_SECRET:-}
    depends_on:
      - backend

  # ---- 5) [test 3.3] Cloudflare Tunnel : 인터넷 → frontend 로 연결하는 통로 ----
  # 공유기 포트포워딩 없이, 이 Mac 이 Cloudflare 쪽으로 "먼저" 연결을 열어 두는 방식이라 안전하고 HTTPS 도 자동.
  # profiles: [tunnel] → 평소 docker compose up 에는 안 켜지고, --profile tunnel 을 붙일 때만 켜짐
  # 토큰 받는 법은 README 의 "인터넷에 공개하기" 참고
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: menu-tunnel
    restart: unless-stopped
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}   # .env 에서 읽음
    depends_on:
      - frontend

# 위에서 사용한 이름 있는 볼륨을 선언하는 곳 (Docker가 알아서 저장 위치를 관리함)
volumes:
  ollama_data:
  menu_db_data:   # [test 3.0] DB 데이터
