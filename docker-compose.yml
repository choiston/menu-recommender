# =============================================================================
# docker-compose.yml - 컨테이너 3개를 한 번에 띄우는 설정 파일
#
#   [브라우저] --5500--> frontend (화면 파일 제공)
#   [브라우저] --8001--> backend  (FastAPI, main.py) --11434--> ollama (LLM)
#
# 컨테이너란? 프로그램 + 실행에 필요한 환경(파이썬 등)을 통째로 담은 작은 가상 컴퓨터.
# 내 PC에 파이썬이나 Ollama를 직접 설치하지 않아도 어디서나 똑같이 실행됩니다.
#
# 자주 쓰는 명령 (이 파일이 있는 폴더에서 실행):
#   docker compose up -d --build   # 이미지 빌드 + 백그라운드(-d)로 실행
#   docker compose down            # 전부 종료
#   docker compose logs -f backend # 백엔드 로그 실시간 보기
#
# YAML 문법: 들여쓰기(스페이스)로 계층을 표현합니다. 탭(Tab) 문자는 쓰면 안 됩니다!
#            "- 값" 은 리스트(목록)의 한 항목입니다.
# =============================================================================

services:  # 실행할 컨테이너(서비스) 목록

  # ---- 1) Ollama : LLM(llama3.1)을 실제로 돌리는 서버 ----
  ollama:
    image: ollama/ollama        # Docker Hub 에 올라와 있는 공식 이미지를 받아서 그대로 사용
    container_name: menu-ollama # 컨테이너 이름 (docker exec -it menu-ollama ... 할 때 쓰는 이름)
    ports:
      - "11434:11434"           # "내PC포트:컨테이너포트" → 내 PC의 11434로 접속하면 컨테이너 11434로 연결
    volumes:
      # 볼륨: 컨테이너를 지워도 데이터가 남는 저장 공간.
      # 다운로드한 모델(수 GB)이 /root/.ollama 에 저장되므로, 볼륨이 없으면 재시작할 때마다 다시 받아야 함
      - ollama_data:/root/.ollama

  # ---- 2) Backend : 우리가 만든 FastAPI 서버 (backend/main.py) ----
  backend:
    build: ./backend            # 이미지를 받지 않고 ./backend/Dockerfile 로 직접 만듦(빌드)
    container_name: menu-backend
    environment:                # 컨테이너 안에 넣어 줄 환경변수 → main.py 의 os.getenv() 가 읽음
      # 같은 compose 안의 컨테이너끼리는 "서비스 이름"으로 서로를 찾을 수 있습니다.
      # 그래서 localhost 가 아니라 ollama 라고 씀 (컨테이너 안에서 localhost 는 "자기 자신"을 뜻함)
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.1   # 사용할 모델. 바꾸려면 여기 수정 후 그 모델을 pull 해야 함
    ports:
      # 내 PC의 8000번은 다른 프로젝트(investment_backend)가 이미 쓰고 있어서 8001번으로 연결.
      # 컨테이너 안에서는 여전히 8000번으로 실행됨 (Dockerfile 의 CMD 참고)
      - "8001:8000"
    depends_on:
      - ollama                  # ollama 컨테이너를 먼저 시작한 뒤 backend 를 시작
                                # (주의: "시작 순서"만 보장. ollama 가 완전히 준비됐는지까지 기다리진 않음)

  # ---- 3) Frontend : HTML/CSS/JS 파일을 브라우저에 전달하는 간단한 웹 서버 ----
  frontend:
    build: ./frontend           # ./frontend/Dockerfile 로 빌드
    container_name: menu-frontend
    ports:
      - "5500:5500"             # 브라우저에서 http://localhost:5500 으로 접속
    depends_on:
      - backend

# 위에서 사용한 이름 있는 볼륨을 선언하는 곳 (Docker가 알아서 저장 위치를 관리함)
volumes:
  ollama_data:
