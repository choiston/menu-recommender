services:
  ollama:
    image: ollama/ollama
    container_name: menu-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: ./backend
    container_name: menu-backend
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.1
    ports:
      - "8001:8000"
    depends_on:
      - ollama

  frontend:
    build: ./frontend
    container_name: menu-frontend
    ports:
      - "5500:5500"
    depends_on:
      - backend

volumes:
  ollama_data:
