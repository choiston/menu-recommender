# =============================================================================
# frontend/menu-common.conf - 80번·81번 입구가 함께 쓰는 설정            (test 3.4)
# nginx.conf 의 두 server 블록에서 include 로 불러와요 (같은 내용을 두 번 쓰지 않으려고)
# =============================================================================

root /usr/share/nginx/html;
index index.html;

# 요청 본문 크기 제한 (우리 API는 작은 JSON만 받음)
client_max_body_size 1m;

# 기본 보안 머리글
add_header X-Content-Type-Options nosniff always;               # 파일 종류를 멋대로 추측하지 않게
add_header X-Frame-Options DENY always;                         # 다른 사이트가 우리 화면을 몰래 끼워 넣지 못하게
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;   # 위치·카메라·마이크 사용 안 함을 선언

# ---- API → 백엔드 (요청 횟수 제한을 주소별로 다르게) ----
# burst : 잠깐 몰려오는 요청은 이만큼 더 받아 줌 / nodelay : 받아 준 요청은 기다리지 않고 바로 처리

# 로그인·가입·로그아웃·탈퇴 : 가장 엄격 (비밀번호 무차별 대입 방지)
location /api/auth/ {
    limit_req zone=menu_auth burst=5 nodelay;
    include /etc/nginx/menu-proxy.conf;
}

# AI 문장 (오래 걸리고 서버 자원을 많이 씀)
# ~ : 정규식 주소.  /api/comment 와 /api/me/insight
location ~ ^/api/(comment|me/insight) {
    limit_req zone=menu_ai burst=10 nodelay;
    include /etc/nginx/menu-proxy.conf;
}

# 그 밖의 API (라운드, 룰렛, 결정 기록 …)
location /api/ {
    limit_req zone=menu_api burst=40 nodelay;
    include /etc/nginx/menu-proxy.conf;
}

# ---- 화면 파일 ----
location / {
    try_files $uri $uri/ /index.html;
}
