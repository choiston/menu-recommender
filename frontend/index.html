<!DOCTYPE html>
<!--
  index.html : 화면의 "뼈대(구조)"                          버전: test 2.1
  - 꾸미기(색, 크기, 배치)는 style.css
  - 동작(클릭하면 서버에 보내기 등)은 app.js

  화면은 3개입니다. 실제로는 한 페이지 안에 3개 화면을 다 만들어 두고,
  app.js 가 지금 단계에 맞는 화면 하나만 보이게(나머지는 hidden) 바꿔 줍니다.
    ① 시작 화면   (id="screen-start")  : 식사 시간 / 기분 / 인원수 / 재료 입력
    ② 라운드 화면 (id="screen-round")  : 끌리는 메뉴 클릭 → [다음] → 그 메뉴의 관련 메뉴로 깊이 들어감
    ③ 결과 화면   (id="screen-result") : AI가 고른 하나 + 원 모어 띵크 + 메뉴 정보
-->
<html lang="ko">
<head>
  <!-- 글자 인코딩을 UTF-8로 지정 (이게 없으면 한글이 깨질 수 있음) -->
  <meta charset="UTF-8" />
  <!-- 모바일에서 화면 폭에 맞춰 보이게 하는 설정 (반응형 웹의 기본) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 브라우저 탭에 표시되는 제목 -->
  <title>오늘 뭐 먹지? - test 2.1</title>
  <!-- 브라우저 탭의 작은 아이콘(파비콘)에도 캐릭터 그림 사용 -->
  <link rel="icon" href="title.png" />
  <!-- 디자인 파일(style.css) 연결 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 앱 전체를 감싸는 상자. style.css 의 .app 이 휴대폰 화면처럼 꾸며 줌 -->
  <div class="app">

    <!-- 상단 제목 영역 (3개 화면 공통) -->
    <header>
      <h1>
        <!--
          타이틀 캐릭터 그림 (frontend/title.png).
          alt : 그림을 못 불러올 때나 화면낭독기에서 대신 읽히는 설명 글
          onerror : 그림 파일이 없으면(에러) 그림을 숨기고 옆의 🍽️ 이모지를 보이게 함
        -->
        <img class="title-img" src="title.png" alt="오늘 뭐 먹지 캐릭터"
             onerror="this.hidden = true; this.nextElementSibling.hidden = false;" />
        <span hidden>🍽️</span>
        오늘 뭐 먹지? <span class="version">test 2.1</span>
      </h1>
      <p>몰라도 괜찮아요. 고르다 보면 찾아져요.</p>
    </header>

    <!-- ============================================================
         ① 시작 화면 : 독립변수(출발점) 입력
         ============================================================ -->
    <section id="screen-start" class="screen">
      <!--
        버튼 묶음(chips). data-group 은 "이 버튼들이 무슨 항목인지",
        data-value 는 "이 버튼을 누르면 들어갈 값" 을 HTML 에 적어 두는 방법입니다.
        (data- 로 시작하는 속성은 개발자가 자유롭게 만들어 쓰는 데이터 칸)
        app.js 가 이 값을 읽어서 사용합니다.
      -->
      <div class="field">
        <label>식사 시간</label>
        <div class="chips" data-group="meal">
          <button type="button" data-value="아침">🌅 아침</button>
          <button type="button" data-value="점심">☀️ 점심</button>
          <button type="button" data-value="저녁">🌆 저녁</button>
          <button type="button" data-value="야식">🌙 야식</button>
        </div>
      </div>

      <div class="field">
        <!-- small 태그 : 작은 보조 글씨 -->
        <label>지금 기분 <small>(선택)</small></label>
        <div class="chips" data-group="mood">
          <button type="button" data-value="피곤">😫 피곤</button>
          <button type="button" data-value="스트레스">😤 스트레스</button>
          <button type="button" data-value="우울">😢 우울</button>
          <button type="button" data-value="좋음">😊 좋음</button>
          <button type="button" data-value="보통">😐 보통</button>
        </div>
      </div>

      <div class="field">
        <label>몇 명이서? <small>(선택)</small></label>
        <div class="chips" data-group="people">
          <button type="button" data-value="혼자">🙋 혼자</button>
          <button type="button" data-value="2명">👫 2명</button>
          <button type="button" data-value="3~4명">👨‍👩‍👧 3~4명</button>
          <button type="button" data-value="5명 이상">🎉 5명 이상</button>
        </div>
      </div>

      <div class="field">
        <!-- 필수 재료 : 적으면 이 재료가 들어간 메뉴"만" 나옴 (걸러내기). 여러 개 적으면 그중 하나라도 들어간 메뉴 -->
        <label for="ingredient">필수 재료 <small>(선택, 적으면 이 재료가 들어간 메뉴만 나와요)</small></label>
        <!-- autocomplete="off" : 브라우저가 예전에 입력한 값을 자동완성으로 띄우지 않게 함 -->
        <input id="ingredient" type="text" placeholder="예: 돼지고기, 면, 계란" autocomplete="off" />
      </div>

      <!-- 안심 문구 : "왜 물어봐?" 라는 의심을 줄이기 위한 장치 (기획 노트의 '신뢰 장치') -->
      <p class="notice">🔒 상황에 맞는 메뉴를 고르려고 물어봐요. 입력한 내용은 저장하거나 밖으로 보내지 않아요.</p>

      <!-- class 를 2개 줄 수 있음 (띄어쓰기로 구분) : primary = 주요 버튼 스타일, wide = 가로 꽉 채우기 -->
      <button id="start-btn" class="primary wide" type="button">메뉴 보기 ▶</button>
    </section>

    <!-- ============================================================
         ② 라운드 화면 : 고른 메뉴를 따라 깊이 들어가기
         hidden 속성 : 처음엔 숨겨 둠. app.js 가 필요할 때 보이게 함
         ============================================================ -->
    <section id="screen-round" class="screen" hidden>
      <!-- 진행 상황 표시. 안의 글자는 app.js 가 채움 (예: "라운드 2") -->
      <div class="round-info">
        <span id="round-label"></span>
      </div>

      <!-- 지금까지 고른 메뉴 (사용자가 직접 고른 것이라 분석 결과가 아님). 고른 게 없으면 숨김 -->
      <p id="basket" class="basket" hidden></p>

      <p class="hint">끌리는 메뉴를 눌러 주세요. 고른 메뉴와 관련된 메뉴가 이어서 나와요.</p>

      <!-- 필수 재료 메뉴가 모자랄 때 서버가 보내는 안내 (예: '전복'이 들어간 메뉴가 1개뿐이에요). 평소엔 숨김 -->
      <p id="round-notice" class="round-notice" hidden></p>

      <!-- 메뉴 카드 5개가 들어갈 자리. app.js 가 카드를 만들어 넣음 -->
      <div id="menu-list" class="menu-list"></div>

      <!-- 다 별로일 때의 탈출구: 지금과 다른 종류의 메뉴를 보여 줌 -->
      <button id="explore-btn" type="button" class="link-btn">🔀 다 별로예요, 다른 방향 보기</button>

      <!-- 아래 버튼 3개.
           [◀ 이전]   : 앞 라운드로 (1라운드에선 시작 화면으로) - 글자는 app.js 가 바꿔 줌
           [결과 보기] : 지금까지 고른 메뉴로 결과 화면 (라운드 제한 없음, 원할 때 누르면 끝)
           [다음 ▶]   : 고른 메뉴의 관련 메뉴로 깊이 들어감 -->
      <div class="actions">
        <button id="prev-btn" type="button" class="secondary">◀ 이전</button>
        <button id="result-btn" type="button" class="secondary">결과 보기</button>
        <button id="next-btn" type="button" class="primary">다음 ▶</button>
      </div>
    </section>

    <!-- ============================================================
         ③ 결과 화면 : AI가 하나 골라 주기 + 원 모어 띵크
           🤖 오늘은 이거예요!   ← 고른 메뉴 중 처음 입력에 가장 잘 맞는 하나 + AI 한 줄 코멘트
           🤔 원 모어 띵크       ← 누를 때마다 다른 음식 추천이 아래로 쌓임 (처음엔 가깝게, 점점 멀리)
           📌 내가 고른 메뉴     ← 어디서 출발했는지 작게 표시
         ============================================================ -->
    <section id="screen-result" class="screen" hidden>
      <h2 class="result-title">🤖 오늘은 이거예요!</h2>
      <!-- AI가 고른 메뉴 카드가 들어갈 자리 (app.js 가 채움) -->
      <div id="decision" class="menu-list result"></div>

      <!-- 원 모어 띵크로 추천받은 카드들이 차례로 쌓이는 자리 -->
      <div id="onemore-list" class="menu-list result"></div>

      <button id="onemore-btn" type="button" class="secondary wide-btn">🤔 원 모어 띵크</button>

      <!-- 내가 고른 메뉴 (예: 📌 내가 고른 메뉴: 국밥 → 뼈해장국) -->
      <p id="picked-summary" class="picked-summary"></p>

      <!-- 정보 출처 안내: 칼로리는 추정치라는 것을 솔직하게 알려 줌 -->
      <p class="notice">칼로리는 1인분 기준 대략적인 값이에요. 식당과 양에 따라 달라질 수 있어요.</p>

      <div class="actions">
        <button id="result-prev-btn" type="button" class="secondary">◀ 이전</button>
        <button id="restart-btn" type="button" class="primary">처음부터 다시</button>
      </div>
    </section>

    <!-- 에러 메시지 표시 칸 (평소엔 숨김) -->
    <p id="error" class="error" hidden></p>
  </div>

  <!--
    자바스크립트 파일 연결.
    body 맨 끝에 두는 이유: 위의 HTML 요소들이 먼저 다 만들어진 뒤에 스크립트가 실행되어야
    document.getElementById(...) 같은 코드가 요소를 찾을 수 있기 때문입니다.
  -->
  <script src="app.js"></script>
</body>
</html>
