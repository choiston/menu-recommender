# =============================================================================
# frontend/nginx.conf - 웹 서버(nginx) 설정   (test 3.3: 인터넷 공개용)
#
#   [브라우저] ──> nginx(80) ─┬─ /api/...  → backend:8000 으로 전달 (리버스 프록시)
#                             └─ 그 밖     → index.html / style.css / app.js 파일 제공
#
# 화면과 API가 "같은 주소"에서 나오므로 브라우저의 CORS 제한에 걸리지 않고,
# 바깥에는 이 포트 하나만 열면 됩니다. (backend, db, ollama 는 숨김)
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 요청 본문 크기 제한 (우리 API는 작은 JSON만 받음)
    client_max_body_size 1m;

    # 기본 보안 머리글
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- API → 백엔드 컨테이너로 전달 ----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 코멘트는 수십 초 걸릴 수 있어서 넉넉하게 기다림 (기본 60초)
        proxy_read_timeout 180s;
    }

    # ---- 화면 파일 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
