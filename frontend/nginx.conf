# =============================================================================
# frontend/nginx.conf - 웹 서버(nginx) 설정 "견본(template)"        (test 3.3 → test 3.4 보안 강화)
#
#   [인터넷] → NAS(HTTPS, 역방향 프록시) → 이 Mac:FRONTEND_PORT → nginx 80번 ─┬─ /api/... → backend:8000
#   [이 Mac 에서 확인] → 127.0.0.1:LOCAL_PORT → nginx 81번 ───────────────────┘   그 밖 → 화면 파일
#
# 이 파일은 "견본"이라 컨테이너가 켜질 때 ${PROXY_SECRET} 자리에 .env 의 값이 채워집니다.
#   (nginx 공식 이미지의 기능: /etc/nginx/templates/*.template → 환경변수를 넣어 conf.d/ 로 복사)
#   $host 처럼 nginx 자체 변수는 그대로 남아요 (환경변수로 정의된 이름만 바뀜)
#
# [test 3.4] 추가한 것
#   ① 비밀 머리글 검사 : 80번(바깥용)은 NAS 가 붙여 주는 X-Menu-Proxy 머리글이 맞아야만 통과
#                       → 같은 와이파이의 다른 기기가 HTTPS 를 건너뛰고 직접 들어오는 것을 막음
#                       (Mac 의 Docker 는 접속한 기기의 IP 를 바꿔 버려서 "NAS IP 만 허용"이 잘 안 됨 → 비밀 머리글 방식)
#   ② 진짜 사용자 IP  : NAS 가 넘겨준 X-Forwarded-For 에서 원래 접속한 사람의 IP 를 꺼냄
#   ③ 요청 횟수 제한  : 같은 IP 가 너무 자주 부르면 429(너무 많은 요청)로 막음 → 로그인 무차별 대입, 가입 남발, AI 남용 방지
# =============================================================================

# ---- ③ 요청 횟수 제한 "구역" 만들기 ----
# limit_req_zone 기준키 zone=이름:메모리 rate=속도
#   $binary_remote_addr : 접속한 IP (②에서 진짜 사용자 IP 로 바뀐 값)
#   10m : IP 기록용 메모리 10MB (약 16만 개 IP)
limit_req_zone $binary_remote_addr zone=menu_auth:10m rate=10r/m;   # 로그인·가입: 1분에 10번
limit_req_zone $binary_remote_addr zone=menu_ai:10m   rate=20r/m;   # AI 코멘트·내 취향: 1분에 20번
limit_req_zone $binary_remote_addr zone=menu_api:10m  rate=5r/s;    # 그 밖의 API: 1초에 5번
limit_req_status 429;   # 막을 때 돌려줄 상태 코드 (429 Too Many Requests)

# ---- 80번 : 바깥(인터넷 → NAS)에서 들어오는 입구 ----
server {
    listen 80;
    server_name _;

    # ② 진짜 사용자 IP : 사설망(NAS, Docker 내부)에서 온 요청이면 X-Forwarded-For 의 값을 믿고 진짜 IP 로 사용
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ① 비밀 머리글 검사
    #   "비밀값:받은머리글" 을 이어 붙인 글자를 정규식으로 검사
    #     - 비밀값이 비어 있으면(.env 에 PROXY_SECRET 없음) → ":..." 모양 → 검사 안 함 (개발 PC 용)
    #     - 비밀값이 있으면 → "abc:abc" 처럼 두 값이 같을 때만 통과 ( \2 = 앞에서 찾은 값과 똑같은 글자 )
    set $menu_check "${PROXY_SECRET}:$http_x_menu_proxy";
    if ($menu_check !~ "^(:.*|(.+):\2)$") {
        return 403;   # 403 Forbidden : 들어올 수 없음
    }

    include /etc/nginx/menu-common.conf;
}

# ---- 81번 : 이 Mac 자신에서 확인할 때만 쓰는 입구 (docker-compose 에서 127.0.0.1 에만 열림) ----
server {
    listen 81;
    server_name _;
    include /etc/nginx/menu-common.conf;
}
