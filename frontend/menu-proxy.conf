# =============================================================================
# frontend/menu-proxy.conf - /api 요청을 백엔드로 넘길 때의 공통 설정      (test 3.4)
# =============================================================================

proxy_pass http://backend:8000;                 # compose 안의 백엔드 컨테이너
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;        # 진짜 사용자 IP (nginx.conf 의 real_ip 처리 뒤의 값)
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Menu-Proxy "";               # 비밀 머리글은 백엔드까지 넘기지 않음
proxy_read_timeout 180s;                        # AI 코멘트는 수십 초 걸릴 수 있어서 넉넉하게
