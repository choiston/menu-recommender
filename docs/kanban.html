<!DOCTYPE html>
<!--
  docs/kanban.html - "오늘 뭐 먹지?" 개발 관리 칸반보드                  기준 버전: test 3.1

  문서 역할 나누기
    - 칸반 (이 파일)     : "무엇을 할지" 관리. 결정할 때, "실행"할 때마다 갱신
    - Structure.html     : 버전 보고서 (처음부터의 흐름, 현재 구조, 계획). "실행"할 때마다 갱신
    - README.md          : 자세한 결정 이유, 업데이트 기록, 배운 개념, 문제 해결

  [데이터 하나 → 화면 4개]
    예전 칸반은 같은 항목을 칸반 카드, 백로그 표, To-Do 목록, 이력에 "손으로 4번" 적어서 금방 서로 어긋났어요.
    이제는 아래 <script> 의 TASKS(할 일 목록) 와 STAGES(진행 단계) 만 고치면,
    칸반 / 백로그 / To-Do / 진행 이력 화면과 숫자가 모두 "자동으로" 그려집니다. (데이터 주도 렌더링)

  카드 번호(#1, #2 ...)는 README 업데이트 기록과 커밋 메시지에서 같은 번호로 가리킵니다.
  카드 상태는 Claude 가 "실행"할 때 바꿉니다 (끌어서 옮기기 기능은 일부러 넣지 않음 → 기록이 항상 실제 코드와 일치).
  To-Do 화면의 체크 표시는 "내 확인용"이라 이 브라우저에만 저장됩니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 뭐 먹지? 칸반보드</title>
  <link rel="icon" href="../frontend/title.png" />
  <style>

    :root {

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111827; --surface: #1f2937; --surface-2: #111827; --text: #f9fafb; --muted: #9ca3af; --border: #374151; --accent-soft: #3d2519;
      }
    }
    :root[data-theme="dark"] {
      --bg: #111827; --surface: #1f2937; --surface-2: #111827; --text: #f9fafb; --muted: #9ca3af; --border: #374151; --accent-soft: #3d2519;
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
           background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.55; }

    /* ===== 머리글 ===== */
    .header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;

    .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.2rem; color: var(--accent); }
    .logo img { width: 34px; height: 34px; object-fit: contain; border-radius: 8px; }
    .sub { color: var(--muted); font-size: 0.8rem; }
    .tabs { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
    .tab, .chip, .theme-btn { border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
      border-radius: 999px; padding: 5px 13px; font: inherit; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .chip.active { background: var(--text); border-color: var(--text); color: var(--surface); }

    .page { display: none; padding: 18px 20px 60px; max-width: 1600px; margin: 0 auto; }
    .page.active { display: block; }

    /* ===== 통계 ===== */
    .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

    .stat b { font-size: 1rem; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }

    /* ===== 칸반 ===== */
    .board { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; align-items: start; overflow-x: auto; }
    .col { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .col-head { display: flex; align-items: center; gap: 8px; padding: 11px 13px; border-bottom: 1px solid var(--border); font-weight: 800; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .count { margin-left: auto; font-size: 0.75rem; color: var(--muted); background: var(--surface); border: 1px solid var(--border);
             border-radius: 999px; padding: 0 8px; }
    .cards { display: flex; flex-direction: column; gap: 8px; padding: 10px; min-height: 50px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); }
    .card .t { font-weight: 700; font-size: 0.87rem; }
    .card .id { color: var(--muted); font-weight: 800; margin-right: 4px; }
    .card .d { color: var(--muted); font-size: 0.78rem; margin-top: 3px; }
    .meta { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-top: 7px; }
    .tag { font-size: 0.68rem; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); }
    .ver { font-size: 0.66rem; font-weight: 800; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
    .prio { margin-left: auto; font-size: 0.68rem; font-weight: 800; padding: 1px 7px; border-radius: 999px; }
    .p-high { background: #fee2e2; color: #dc2626; } .p-mid { background: #fef3c7; color: #d97706; } .p-low { background: #dcfce7; color: #16a34a; }

    @media (max-width: 480px) { .board { grid-template-columns: 1fr; } }

    /* ===== 표 (백로그) ===== */
    h2 { font-size: 1.05rem; margin: 18px 0 8px; display: flex; gap: 8px; align-items: center; }
    .cnt { font-size: 0.75rem; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 9px; background: var(--surface); }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
    table { border-collapse: collapse; width: 100%; font-size: 0.83rem; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { background: var(--surface-2); color: var(--muted); white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    .status { font-size: 0.72rem; font-weight: 800; padding: 2px 9px; border-radius: 999px; color: #fff; white-space: nowrap; }

    /* ===== To-Do ===== */
    .todo { display: flex; gap: 10px; align-items: flex-start; padding: 10px 13px; margin-bottom: 6px;
            background: var(--surface); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; }
    .todo.checked { opacity: 0.55; } .todo.checked .t { text-decoration: line-through; }
    .box { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--border); flex-shrink: 0; margin-top: 2px;
           display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #fff; }
    .todo.checked .box { background: var(--c-done); border-color: var(--c-done); }
    .progress { margin-top: 18px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
    .bar { height: 14px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; margin-top: 6px; }
    .bar div { height: 100%; background: var(--c-done); transition: width 0.3s; }
    .hint { color: var(--muted); font-size: 0.8rem; }

    /* ===== 진행 이력 ===== */
    .tl { display: flex; gap: 12px; }
    .tl-left { display: flex; flex-direction: column; align-items: center; }
    .tl-dot { width: 30px; height: 30px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 0.78rem;

    .tl-line { flex: 1; width: 2px; background: var(--border); min-height: 16px; margin: 3px 0; }
    .tl-body { padding-bottom: 16px; }
    .tl-body .t { font-weight: 700; }
  </style>
</head>

  { n: 5,  title: "사용자 심리와 설계", ver: "기획", desc: "먼저 보여 주기, 5개만, 조사 거부감, 독립변수" },

// =============================================================================
// ② 그리기 : 데이터 → 화면 (아래는 고칠 필요 없음)
// =============================================================================
const $ = (id) => document.getElementById(id);
let filter = "all";

/** 요소 만들기 도우미: el("div", "class", "글자") */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

const PRIO = { high: ["높음", "p-high"], mid: ["중간", "p-mid"], low: ["낮음", "p-low"] };

/** 카드 꼬리표 줄 (분야 · 버전 · 우선순위) */
function metaRow(t) {
  const meta = el("div", "meta");
  for (const a of t.area) meta.appendChild(el("span", "tag", AREAS[a]));
  meta.appendChild(el("span", "ver", t.status === "done" ? `${t.ver} ✓` : t.ver));
  if (t.prio && t.status !== "done") meta.appendChild(el("span", `prio ${PRIO[t.prio][1]}`, PRIO[t.prio][0]));
  return meta;
}

function renderKanban() {
  // 통계 (자동 계산)
  const stats = $("stats");
  stats.replaceChildren();
  for (const [key, s] of Object.entries(STATUS)) {
    const pill = el("div", "stat");
    const b = el("b", "", TASKS.filter((t) => t.status === key).length);
    b.style.color = s.color;
    pill.append(b, el("span", "", s.label.slice(2).trim()));
    stats.appendChild(pill);
  }

  // 분야 필터
  const filters = $("filters");
  filters.replaceChildren();
  for (const [key, label] of [["all", "전체"], ...Object.entries(AREAS)]) {
    const chip = el("button", "chip" + (filter === key ? " active" : ""), label);
    chip.addEventListener("click", () => { filter = key; renderKanban(); });
    filters.appendChild(chip);
  }

  // 칸 5개
  const board = $("board");
  board.replaceChildren();
  for (const [key, s] of Object.entries(STATUS)) {
    const list = TASKS.filter((t) => t.status === key && (filter === "all" || t.area.includes(filter)))
                      .sort((a, b) => (key === "done" ? b.id - a.id : a.id - b.id));  // 완료는 최신이 위
    const col = el("div", "col");
    const head = el("div", "col-head");
    const dot = el("span", "dot");
    dot.style.background = s.color;
    head.append(dot, el("span", "", s.label), el("span", "count", list.length));
    const cards = el("div", "cards");
    for (const t of list) {
      const card = el("div", "card");
      const title = el("div", "t");
      title.append(el("span", "id", `#${t.id}`), document.createTextNode(t.title));
      card.append(title, el("div", "d", t.desc), metaRow(t));
      cards.appendChild(card);
    }
    col.append(head, cards);
    board.appendChild(col);
  }
}

function renderBacklog() {
  const root = $("backlog");
  root.replaceChildren();
  // 상태별로 표 하나씩 (진행 중 → 검토 → To-Do → 백로그 → 완료 순)
  for (const key of ["doing", "review", "todo", "backlog", "done"]) {
    const list = TASKS.filter((t) => t.status === key);
    if (!list.length) continue;
    const h = el("h2", "", STATUS[key].label);
    h.appendChild(el("span", "cnt", `${list.length}개`));
    const wrap = el("div", "table-wrap");
    const table = el("table");
    const head = el("tr");
    for (const th of ["#", "제목", "설명", "버전", "분야", "상태"]) head.appendChild(el("th", "", th));
    table.appendChild(head);
    for (const t of list) {
      const tr = el("tr");
      const st = el("span", "status", STATUS[t.status].label.slice(2).trim());
      st.style.background = STATUS[t.status].color;
      const stTd = el("td");
      stTd.appendChild(st);
      tr.append(el("td", "", `#${t.id}`), el("td", "", t.title), el("td", "", t.desc), el("td", "", t.ver),
                el("td", "", t.area.map((a) => AREAS[a]).join(" ")), stTd);
      table.appendChild(tr);
    }
    wrap.appendChild(table);
    root.append(h, wrap);
  }
}

// To-Do 체크는 이 브라우저에만 저장 (막혀 있는 환경도 있어서 try/catch)
function loadChecks() { try { return JSON.parse(localStorage.getItem("kanban-checks") || "[]"); } catch (e) { return []; } }
function saveChecks(ids) { try { localStorage.setItem("kanban-checks", JSON.stringify(ids)); } catch (e) {} }

function renderTodo() {
  const root = $("todo");
  root.replaceChildren();
  const checks = new Set(loadChecks());
  for (const key of ["doing", "review", "todo", "backlog"]) {
    const list = TASKS.filter((t) => t.status === key);
    if (!list.length) continue;
    root.appendChild(el("h2", "", STATUS[key].label));
    for (const t of list) {
      const item = el("div", "todo" + (checks.has(t.id) ? " checked" : ""));
      const box = el("div", "box", "✓");
      const body = el("div");
      const title = el("div", "t");
      title.append(el("span", "id", `#${t.id} `), document.createTextNode(t.title));
      body.append(title, el("div", "hint", t.desc), metaRow(t));
      item.append(box, body);
      item.addEventListener("click", () => {
        checks.has(t.id) ? checks.delete(t.id) : checks.add(t.id);
        saveChecks([...checks]);
        renderTodo();
      });
      root.appendChild(item);
    }
  }
  // 진행률 = 완료 카드 / 전체 카드 (실제 상태 기준)
  const done = TASKS.filter((t) => t.status === "done").length;
  const pct = Math.round((done / TASKS.length) * 100);
  $("progress-text").textContent = `${done} / ${TASKS.length} 완료 (${pct}%)`;
  $("progress-bar").style.width = pct + "%";
}

function renderHistory() {
  const root = $("history");
  root.replaceChildren();
  const h = el("h2", "", "📅 진행 이력");
  h.appendChild(el("span", "cnt", `${STAGES.length}단계 · 자세한 내용은 Structure.html`));
  root.appendChild(h);
  STAGES.forEach((s, i) => {
    const row = el("div", "tl");
    const left = el("div", "tl-left");
    const dot = el("div", "tl-dot", s.n);
    if (s.current) dot.style.background = "var(--c-doing)";
    left.appendChild(dot);
    if (i < STAGES.length - 1) left.appendChild(el("div", "tl-line"));
    const body = el("div", "tl-body");
    const title = el("div", "t", s.title + " ");
    title.appendChild(el("span", "ver", s.current ? `${s.ver} · 현재` : s.ver));
    body.append(title, el("div", "hint", s.desc));
    row.append(left, body);
    root.appendChild(row);
  });
}

// 탭 전환
for (const tab of document.querySelectorAll(".tab")) {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t === tab));
    document.querySelectorAll(".page").forEach((p) => p.classList.toggle("active", p.id === "page-" + tab.dataset.page));
  });
}

// 밝기 전환 (선택은 브라우저에 기억)
$("theme-btn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme === "dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("kanban-theme", root.dataset.theme); } catch (e) {}
});
try { const t = localStorage.getItem("kanban-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

$("sub").textContent = `menu-recommender · ${VERSION} 기준 · ${UPDATED} · 카드 ${TASKS.length}개`;
renderKanban();
renderBacklog();
renderTodo();
renderHistory();
</script>
